services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birthday}
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-birthday}:${POSTGRES_PASSWORD:-birthday-local-only}@postgres:5432/${POSTGRES_DB:-birthday}?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PRINT_ADMIN_INVITATION: ${PRINT_ADMIN_INVITATION:-true}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-15}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-100}
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
    volumes:
      - party-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8080
    environment:
      # Compose reads these values from the repository-root .env automatically.
      BIRTHDAY_AGE: ${BIRTHDAY_AGE:-30}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-15}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-100}
      # Preserve the difference between missing variables and explicit empty values.
      INVITATION_TITLE:
      INVITATION_DESCRIPTION:
      INVITATION_TITLE_EN:
      INVITATION_TITLE_FR:
      INVITATION_TITLE_DE:
      INVITATION_TITLE_IT:
      INVITATION_TITLE_ES:
      INVITATION_DESCRIPTION_EN:
      INVITATION_DESCRIPTION_FR:
      INVITATION_DESCRIPTION_DE:
      INVITATION_DESCRIPTION_IT:
      INVITATION_DESCRIPTION_ES:
      # Keep container networking independent from local development settings.
      API_INTERNAL_URL: http://backend:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  party-data:
  postgres-data:
