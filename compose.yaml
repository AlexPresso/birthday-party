services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birthday}
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:5432/?sslmode=disable
      PGDATABASE: ${POSTGRES_DB:-birthday}
      PGUSER: ${POSTGRES_USER:-birthday}
      PGPASSWORD: ${POSTGRES_PASSWORD:-birthday-local-only}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PRINT_ADMIN_INVITATION: ${PRINT_ADMIN_INVITATION:-true}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-15}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-100}
      # Import existing product settings once; later edits live in admin settings.
      BIRTHDAY_AGE: ${BIRTHDAY_AGE:-30}
      # Preserve missing (default copy) and empty (hidden copy) values.
      INVITATION_TITLE:
      INVITATION_DESCRIPTION:
      INVITATION_TITLE_EN:
      INVITATION_TITLE_FR:
      INVITATION_TITLE_DE:
      INVITATION_TITLE_IT:
      INVITATION_TITLE_ES:
      INVITATION_DESCRIPTION_EN:
      INVITATION_DESCRIPTION_FR:
      INVITATION_DESCRIPTION_DE:
      INVITATION_DESCRIPTION_IT:
      INVITATION_DESCRIPTION_ES:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
    volumes:
      - party-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # Keep container networking independent from local development settings.
      API_INTERNAL_URL: http://backend:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  party-data:
  postgres-data:
